name: Email con db.json al hacer push

on:
  push:
    branches: ['**']

jobs:
  send-db-email:
    if: github.repository == 'Ariel-GonzAguer/comida-emergencia-mini-privado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Obtener db.json del remote privado
        run: git show HEAD~1:db.json > db.json || git show HEAD:db.json > db.json || echo "No se pudo obtener db.json"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - run: pnpm add nodemailer

      - uses: actions/github-script@v8
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        with:
          script: |
            const fs = require('fs');

            const db = JSON.parse(fs.readFileSync('db.json', 'utf8'));
            const hoy = new Date();
            const fecha = hoy.toLocaleDateString('es-CR', {
              year: 'numeric', month: 'long', day: 'numeric',
              hour: '2-digit', minute: '2-digit'
            });

            const commitMsg = context.payload.head_commit?.message || 'Sin mensaje';
            const autor = context.payload.head_commit?.author?.name || context.actor;
            const branch = context.ref.replace('refs/heads/', '');

            const categorias = {};
            for (const item of db.insumos) {
              const cat = item.categoria || 'sin categoría';
              if (!categorias[cat]) categorias[cat] = [];
              categorias[cat].push(item);
            }

            const totalInsumos = db.insumos.length;
            const totalCats = Object.keys(categorias).length;

            let filas = '';
            for (const [cat, items] of Object.entries(categorias).sort()) {
              filas += `<tr><td colspan="7" style="background:#f0f0f0;font-weight:bold;padding:8px;text-transform:capitalize;">${cat} (${items.length})</td></tr>`;
              for (const i of items.sort((a, b) => a.nombre.localeCompare(b.nombre))) {
                const sim = (i.simbolos || []).join(', ') || '-';
                const venc = i.vencimiento || '-';
                const cal = i.calorias ?? '-';
                const prot = i.proteina ?? '-';
                const notas = i.notas || '';
                filas += `<tr>
                  <td style="padding:4px 8px;border:1px solid #ddd;">${i.nombre}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;">${i.cantidad || '-'} ${i.unidad || ''}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;">${venc}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;">${cal}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;">${prot}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;text-align:center;">${sim}</td>
                  <td style="padding:4px 8px;border:1px solid #ddd;">${notas}</td>
                </tr>`;
              }
            }

            const html = `
            <div style="font-family:Arial,sans-serif;max-width:900px;margin:0 auto;">
              <h2 style="color:#333;">Resumen de db.json — comida-emergencia-mini</h2>
              <p style="color:#666;">
                <b>Fecha:</b> ${fecha}<br>
                <b>Branch:</b> ${branch}<br>
                <b>Commit:</b> ${commitMsg}<br>
                <b>Autor:</b> ${autor}
              </p>
              <p style="color:#666;">
                <b>Total:</b> ${totalInsumos} insumos en ${totalCats} categorías
              </p>
              <table style="border-collapse:collapse;width:100%;font-size:13px;">
                <thead>
                  <tr style="background:#333;color:#fff;">
                    <th style="padding:6px 8px;border:1px solid #555;text-align:left;">Nombre</th>
                    <th style="padding:6px 8px;border:1px solid #555;">Cantidad</th>
                    <th style="padding:6px 8px;border:1px solid #555;">Vencimiento</th>
                    <th style="padding:6px 8px;border:1px solid #555;">Calorias</th>
                    <th style="padding:6px 8px;border:1px solid #555;">Proteina</th>
                    <th style="padding:6px 8px;border:1px solid #555;">Simbolos</th>
                    <th style="padding:6px 8px;border:1px solid #555;text-align:left;">Notas</th>
                  </tr>
                </thead>
                <tbody>${filas}</tbody>
              </table>
              <p style="color:#999;font-size:11px;margin-top:16px;">
                Generado automaticamente por GitHub Actions
              </p>
            </div>`;

            const textoPlano = `Push a ${branch} por ${autor}\nCommit: ${commitMsg}\nFecha: ${fecha}\n\nTotal: ${totalInsumos} insumos en ${totalCats} categorias.`;

            console.log(html);

            const nodemailer = require('nodemailer');
            const transporter = nodemailer.createTransport({
              service: 'gmail',
              auth: {
                user: process.env.EMAIL_USER,
                pass: process.env.EMAIL_PASS
              }
            });

            const asunto = `[db.json] Push a ${branch} — ${totalInsumos} insumos — ${fecha}`;

            await transporter.sendMail({
              from: process.env.EMAIL_USER,
              to: 'ariegonzaguer@gmail.com',
              subject: asunto,
              text: textoPlano,
              html
            });

            console.log(`Correo enviado con ${totalInsumos} insumos.`);
