name: Prettier Fix

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - mini

jobs:
  prettier-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        run: pnpm install

      - name: Ejecutar Prettier Fix
        run: pnpm prettierFix
      - name: Mostrar mensaje si se corrige el formato
        if: success()
        run: |
          echo "✓ El formato de código ha sido corregido automáticamente con Prettier."
          echo "Revisa los cambios y haz commit si es necesario."
          echo "Documentación: https://prettier.io/docs/en/cli.html"
