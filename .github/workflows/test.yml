name: Test

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - main
      - mini
  pull_request:
    branches:
      - main
      - mini

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Instalar dependencias (raíz)
        run: pnpm install

      - name: Instalar dependencias (client)
        working-directory: client
        run: pnpm install

      - name: Ejecutar pruebas del servidor (raíz)
        run: pnpm test:run

      - name: Ejecutar pruebas del cliente (client)
        working-directory: client
        run: pnpm test:run

      - name: Mostrar mensaje personalizado si fallan las pruebas
        if: failure()
        run: |
          echo "✕ Las pruebas automáticas han fallado."
          echo "Por favor revisa los errores y corrígelos antes de continuar."
          echo "Documentación: https://vitest.dev/guide/cli.html"
