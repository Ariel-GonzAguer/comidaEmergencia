name: Aviso de vencimientos

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  check-vencimientos:
    if: github.repository == 'Ariel-GonzAguer/comida-emergencia-mini-privado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const db = JSON.parse(fs.readFileSync('db.json', 'utf8'));
            const hoy = new Date();
            const mesActual = hoy.getMonth() + 1;
            const anioActual = hoy.getFullYear();

            let mesAnterior = mesActual - 1;
            let anioAnterior = anioActual;
            if (mesAnterior < 1) {
              mesAnterior = 12;
              anioAnterior--;
            }

            let mesSiguiente = mesActual + 1;
            let anioSiguiente = anioActual;
            if (mesSiguiente > 12) {
              mesSiguiente = 1;
              anioSiguiente++;
            }

            const nombresMeses = [
              '', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
              'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const vencieronMesPasado = db.insumos.filter(item => {
              if (!item.vencimiento || item.vencimiento === 'no vence') return false;
              const [mes, anio] = item.vencimiento.split('-').map(Number);
              return mes === mesAnterior && anio === anioAnterior;
            });

            const vencenMesActual = db.insumos.filter(item => {
              if (!item.vencimiento || item.vencimiento === 'no vence') return false;
              const [mes, anio] = item.vencimiento.split('-').map(Number);
              return mes === mesActual && anio === anioActual;
            });

            const vencenProximoMes = db.insumos.filter(item => {
              if (!item.vencimiento || item.vencimiento === 'no vence') return false;
              const [mes, anio] = item.vencimiento.split('-').map(Number);
              return mes === mesSiguiente && anio === anioSiguiente;
            });

            if (vencieronMesPasado.length === 0 && vencenMesActual.length === 0 && vencenProximoMes.length === 0) {
              console.log('No hay insumos vencidos ni por vencer.');
              return;
            }

            let seccionPasado = '';
            if (vencieronMesPasado.length > 0) {
              const lista = vencieronMesPasado
                .map(i => `- ${i.nombre} (${i.cantidad} ${i.unidad}) — venció ${i.vencimiento}`)
                .join('%0A');
              seccionPasado = `*Vencidos (${nombresMeses[mesAnterior]} ${anioAnterior}):*%0A${lista}%0A%0A`;
            }

            let seccionActual = '';
            if (vencenMesActual.length > 0) {
              const lista = vencenMesActual
                .map(i => `- ${i.nombre} (${i.cantidad} ${i.unidad}) — vence ${i.vencimiento}`)
                .join('%0A');
              seccionActual = `*Vence este mes (${nombresMeses[mesActual]} ${anioActual}):*%0A${lista}%0A%0A`;
            }

            let seccionSiguiente = '';
            if (vencenProximoMes.length > 0) {
              const lista = vencenProximoMes
                .map(i => `- ${i.nombre} (${i.cantidad} ${i.unidad}) — vence ${i.vencimiento}`)
                .join('%0A');
              seccionSiguiente = `*Próximo mes (${nombresMeses[mesSiguiente]} ${anioSiguiente}):*%0A${lista}`;
            }

            const total = vencieronMesPasado.length + vencenMesActual.length + vencenProximoMes.length;
            const mensaje = `*Aviso de vencimientos*%0A%0A${seccionPasado}${seccionActual}${seccionSiguiente}%0A%0ATotal: ${total} insumo(s).`;

            console.log(decodeURIComponent(mensaje));

            const url = `https://api.callmebot.com/whatsapp.php?phone=${process.env.PHONE_NUMBER}&text=${mensaje}&apikey=${process.env.API_KEY}`;

            const res = await fetch(url);
            const data = await res.text();
            console.log('Respuesta CallMeBot:', data);
